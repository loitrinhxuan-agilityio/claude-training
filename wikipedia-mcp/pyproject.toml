[project]
name = "anthropic-wikipedia-mcp"
version = "0.2.0"
description = "MCP server demonstrating Sampling with Anthropic, logging, and progress notifications."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.27,<1",
    "anthropic>=0.49,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "respx>=0.21,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
